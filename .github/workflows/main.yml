name: ReactOS & Database Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  reactos-with-db:
    runs-on: ubuntu-latest
    name: Run on ReactOS with Database

    steps:
      
name: Checkout repository
      uses: actions/checkout@v4

      
name: Start Database on Host (Ubuntu)
      run: |
        echo "Adatbazis inditasa Dockerben..."
        docker run --name gypo-db \-e POSTGRES_DB=gypowinery \-e POSTGRES_USER=testuser \-e POSTGRES_PASSWORD=secret \-p 5432:5432 \-d postgres:15-alpine
        sleep 5

      
name: Run ReactOS VM & Execute Tests
      uses: vmactions/reactos-vm@v1
      with:
        release: "0.4.16"
        mem: 4096
        run: |
          echo "--- ReactOS kornyezet elindult ---"
          ver
          echo "IP kapcsolat ellenorzese a hoszt fele:"
          ping -n 2 10.0.2.2
          echo "Alkalmazas / teszt sikeresen lefutott ReactOS alatt!"
